<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dorutochan Admin</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 2rem 1rem; }
  .panel { max-width: 700px; margin: 0 auto; }
  .panel h1 { margin-bottom: 1.5rem; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .card-admin {
    background: var(--card); padding: 1.5rem; border-radius: 16px;
    margin-bottom: 1.5rem; border: 1px solid var(--border);
  }
  .card-admin h3 { margin-bottom: 1rem; font-size: 1.1rem; }
  .card-admin input, .card-admin textarea {
    width: 100%; padding: .7rem; margin: .4rem 0;
    background: #0d0d14; border: 1px solid #26263a; color: var(--text);
    border-radius: 8px; font-family: inherit; font-size: .95rem;
    outline: none;
  }
  .card-admin input:focus, .card-admin textarea:focus { border-color: var(--accent-2); }
  .card-admin button {
    width: 100%; padding: .85rem; margin-top: .5rem;
    background: var(--grad); border: none;
    color: #fff; font-weight: 700; cursor: pointer;
    border-radius: 8px; font-family: inherit; font-size: 1rem;
  }
  .card-admin button:hover { opacity: .9; }
  .card-admin label { font-size: .8rem; color: var(--muted); display: block; margin-top: .5rem; }
  .log { font-size: .85rem; color: #7cffb2; margin-top: .5rem; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="panel">
  <h1>🛠 Dorutochan Admin</h1>

  <!-- CONFIG -->
  <div class="card-admin">
    <h3>⚙️ GitHub Config</h3>
    <label>Token (PAT — repo scope)</label>
    <input type="password" id="token" placeholder="ghp_...">
    <label>Repo (user/repo)</label>
    <input id="repo" placeholder="yourname/dorutochan">
    <button onclick="saveCfg()">Save Config</button>
    <div class="log" id="cfgLog"></div>
  </div>

  <!-- ADD POST -->
  <div class="card-admin">
    <h3>➕ Add Post (Anime/Cartoon)</h3>
    <input id="pTitle" placeholder="Title">
    <input id="pImage" placeholder="Image URL (2:3 portrait poster)">
    <input id="pLink" placeholder="Telegram post link">
    <input id="pTags" placeholder="Tags (comma separated)">
    <input id="pType" placeholder="anime / cartoon">
    <label>
      <input type="checkbox" id="pTrending" style="width:auto"> Trending me dikhao
    </label>
    <button onclick="addPost()">Add Post</button>
    <div class="log" id="postLog"></div>
  </div>

  <!-- ADD NEWS -->
  <div class="card-admin">
    <h3>📰 Add News</h3>
    <input id="nTitle" placeholder="News title">
    <textarea id="nBody" placeholder="News body" rows="3"></textarea>
    <button onclick="addNews()">Add News</button>
    <div class="log" id="newsLog"></div>
  </div>

  <!-- ADD REQUEST -->
  <div class="card-admin">
    <h3>📋 Add Request (public dikhane ke liye)</h3>
    <input id="rTitle" placeholder="Title e.g. Naruto Movie 3">
    <input id="rType" placeholder="Anime / Cartoon / Movie">
    <button onclick="addRequest()">Add Request</button>
    <div class="log" id="reqLog2"></div>
  </div>
</div>

<script>
const API = 'https://api.github.com/repos/';

function saveCfg() {
  localStorage.setItem('gh_token', document.getElementById('token').value.trim());
  localStorage.setItem('gh_repo', document.getElementById('repo').value.trim());
  document.getElementById('cfgLog').textContent = '✅ Saved locally.';
}
window.onload = () => {
  document.getElementById('token').value = localStorage.getItem('gh_token') || '';
  document.getElementById('repo').value = localStorage.getItem('gh_repo') || '';
};

async function ghGet(path) {
  const token = localStorage.getItem('gh_token');
  const repo = localStorage.getItem('gh_repo');
  const r = await fetch(`${API}${repo}/contents/${path}?t=${Date.now()}`, {
    headers: { Authorization: `token ${token}` }
  });
  if (!r.ok) return null;
  const j = await r.json();
  const content = decodeURIComponent(escape(atob(j.content)));
  return { sha: j.sha, data: JSON.parse(content) };
}

async function ghPut(path, data, sha, msg) {
  const token = localStorage.getItem('gh_token');
  const repo = localStorage.getItem('gh_repo');
  const body = {
    message: msg,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
    ...(sha ? { sha } : {})
  };
  const r = await fetch(`${API}${repo}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error((await r.json()).message);
  return r.json();
}

async function addPost() {
  const log = document.getElementById('postLog');
  try {
    const cur = await ghGet('data/posts.json');
    const posts = cur?.data || { posts: [] };
    posts.posts.unshift({
      id: Date.now().toString(),
      title: pTitle.value,
      image: pImage.value,
      link: pLink.value,
      tags: pTags.value.split(',').map(s => s.trim()).filter(Boolean),
      type: pType.value || 'anime',
      date: new Date().toISOString().slice(0,10),
      trending: document.getElementById('pTrending').checked
    });
    await ghPut('data/posts.json', posts, cur?.sha, `Add post: ${pTitle.value}`);
    log.textContent = '✅ Post added!';
    ['pTitle','pImage','pLink','pTags','pType'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('pTrending').checked = false;
  } catch (e) { log.textContent = '❌ ' + e.message; }
}

async function addNews() {
  const log = document.getElementById('newsLog');
  try {
    const cur = await ghGet('data/news.json');
    const news = cur?.data || { news: [] };
    news.news.unshift({
      id: Date.now().toString(),
      title: nTitle.value,
      body: nBody.value,
      date: new Date().toISOString().slice(0,10)
    });
    await ghPut('data/news.json', news, cur?.sha, `Add news: ${nTitle.value}`);
    log.textContent = '✅ News added!';
    nTitle.value = ''; nBody.value = '';
  } catch (e) { log.textContent = '❌ ' + e.message; }
}

async function addRequest() {
  const log = document.getElementById('reqLog2');
  try {
    const cur = await ghGet('data/requests.json');
    const data = cur?.data || { requests: [] };
    data.requests.unshift({
      title: rTitle.value,
      type: rType.value || 'Other',
      date: new Date().toISOString().slice(0,10)
    });
    await ghPut('data/requests.json', data, cur?.sha, `Add request: ${rTitle.value}`);
    log.textContent = '✅ Request added!';
    rTitle.value = ''; rType.value = '';
  } catch (e) { log.textContent = '❌ ' + e.message; }
}
</script>
</body>
</html>
